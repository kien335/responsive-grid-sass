<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid - SASS Refactor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Bố cục chính: giữ cấu trúc 12 cột của bản gốc CodeGym -->
    <div class="page-example">
        <div class="gridcontainer">
            <div class="gridwrapper gridwrapper--header">
                <div class="gridcontent gridcontent--full gridcontent--header"></div>
            </div>

            <div class="gridwrapper gridwrapper--body">
                <div class="gridcontent gridcontent--sidebar">
                    <div class="sidebar-link"></div>
                    <div class="sidebar-link"></div>
                    <div class="sidebar-link"></div>
                    <div class="sidebar-link"></div>
                </div>

                <div class="gridcontent gridcontent--gutter"></div>
                <div class="gridcontent gridcontent--gutter"></div>
                <div class="gridcontent gridcontent--gutter"></div>
                <div class="gridcontent gridcontent--gutter"></div>
                <div class="gridcontent gridcontent--gutter"></div>
                <div class="gridcontent gridcontent--gutter"></div>

                <div class="gridcontent gridcontent--sidebar">
                    <div class="sidebar-block"></div>
                </div>
            </div>

            <div class="gridwrapper gridwrapper--footer">
                <div class="gridcontent gridcontent--full gridcontent--footer"></div>
            </div>
        </div>
    </div>

    <!-- Lưới 12 cột mờ để minh họa cấu trúc responsive -->
    <div class="gridcontainer gridcontainer--overlay" aria-hidden="true">
        <div class="gridwrapper gridwrapper--guides">
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
        </div>
    </div>

    <p>Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>
</body>
</html>
